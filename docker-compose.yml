services:
  postgres:
    image: postgres:18
    container_name: tadb-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - tadb_postgres_data:/var/lib/postgresql

volumes:
  tadb_postgres_data: